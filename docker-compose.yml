# ==============================================================================
# SEIA - Orquestación de Contenedores con Docker Compose
# Servicios: seia-ml (IA - FastAPI), seia-services (Backend Express) y seia-app (Frontend Next.js)
# ==============================================================================
services:
  seia-ml:
    container_name: seia-ml
    build: ./seia-ml
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - seia-net

  seia-services:
    container_name: seia-services
    build: ./seia-services
    ports:
      - "4000:4000"
    env_file:
      - ./seia-services/.env
    environment:
      # Dentro de la red de Docker el backend llega al modelo por el nombre del servicio
      SEIA_ML_URL: http://seia-ml:8000
    depends_on:
      seia-ml:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - seia-net

  seia-app:
    container_name: seia-app
    build:
      context: ./seia-app
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_SUPABASE_URL: https://ypbcxctawmwfovusbive.supabase.co
        NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable___a9Pc74iqkqGOwpgdE-7Q_GOp0PKX8
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable___a9Pc74iqkqGOwpgdE-7Q_GOp0PKX8
    ports:
      - "3000:3000"
    env_file:
      - ./seia-app/.env.local
    depends_on:
      - seia-services
    restart: unless-stopped
    networks:
      - seia-net

networks:
  seia-net:
    name: seia-net
    driver: bridge
